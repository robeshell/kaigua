[workspace]
resolver = "2"
members = [
    "crates/media-core",
    "crates/scraper-kit",
    "crates/renamer",
    "desktop/src-tauri",
]

[workspace.package]
edition = "2021"
license = "Proprietary"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
media-core = { path = "crates/media-core" }
renamer = { path = "crates/renamer" }
rusqlite = { version = "0.32", features = ["bundled"] }
scraper-kit = { path = "crates/scraper-kit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
