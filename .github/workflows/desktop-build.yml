name: Desktop build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/desktop-build.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/desktop-build.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Kai brand tokens
        uses: actions/checkout@v4
        with:
          repository: robeshell/kai-brand-design
          path: .kai-brand-design

      - name: Verify generated brand tokens
        working-directory: .
        run: |
          python3 .kai-brand-design/tool/kai_design.py check --skip-viewer
          cmp .kai-brand-design/dist/release/kai-design.lock.json kai-design.lock.json
          cmp .kai-brand-design/dist/css/kaigua/brand.generated.css desktop/src/styles/brand.generated.css

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          prefix-key: kaigua-${{ matrix.target }}

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Verify product token boundary
        run: pnpm tokens:check

      - name: Build Tauri app
        working-directory: desktop
        run: pnpm tauri build
        env:
          CI: true

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: kaigua-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/**
          if-no-files-found: warn
          retention-days: 14
